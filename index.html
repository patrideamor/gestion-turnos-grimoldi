<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración del juego de caracteres para idioma español (tildes, ñ) -->
    <meta charset="UTF-8">
    <!-- Ajuste para diseño responsivo en celulares y tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO TÉCNICO: Título optimizado para motores de búsqueda -->
    <title>Reserva de Turnos Online | Gestión Grimoldi</title>
    
    <!-- SEO TÉCNICO: Descripción visible en los resultados de búsqueda de Google -->
    <meta name="description" content="Solicitá tu turno de forma rápida, sencilla y online. Seleccioná la fecha y horario disponible.">
    
    <!-- Vinculación con la hoja de estilos compartida ubicada en la raíz del proyecto -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <!-- Encabezado principal de la página pública -->
    <header class="header-principal">
        <h1>Sistema de Reserva de Turnos</h1>
        <p>Seleccioná el día y la hora que mejor se adapten a tu agenda.</p>
    </header>

    <!-- Contenedor principal del formulario público -->
    <main class="contenedor-principal">
        <section class="tarjeta-formulario">
            <h2>Solicitar un Nuevo Turno</h2>
            
            <form id="formulario-turno" class="formulario">
                <div class="grupo-campo">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Ana Pérez">
                </div>

                <div class="grupo-campo">
                    <label for="telefono">Teléfono / WhatsApp:</label>
                    <input type="tel" id="telefono" name="telefono" required placeholder="Ej. 1112345678">
                </div>

                <div class="grupo-campo">
                    <label for="fecha">Fecha del Turno:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="grupo-campo">
                    <label for="hora">Horario:</label>
                    <input type="time" id="hora" name="hora" required>
                </div>

                <button type="submit" class="boton-primario">Confirmar Reserva</button>
            </form>

            <!-- Mensaje dinámico de confirmación o error gestionado con JavaScript -->
            <div id="mensaje-respuesta" class="mensaje-oculto"></div>
        </section>
    </main>

    <!--
      MÓDULOS JAVASCRIPT:
      type="module" permite utilizar las sentencias import/export nativas de JavaScript moderno.
      La ruta ./js/ especifica que los archivos están dentro de la subcarpeta 'js'.
    -->
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
