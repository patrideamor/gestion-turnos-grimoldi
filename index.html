<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos - Lic. Gabriela Grimoldi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container" style="max-width: 600px; padding-top: 20px;">
        <header class="admin-header">
            <div class="brand-info">
                <h1>Lic. Gabriela Grimoldi</h1>
                <span class="badge-role"><i class="fa-solid fa-calendar-check"></i> Turnero Público</span>
            </div>
            <nav class="header-nav">
                <a href="admin.html" class="btn-nav btn-nav-outline"><i class="fa-solid fa-user-lock"></i> Acceso Admin</a>
            </nav>
        </header>

        <div class="public-card">
            <h3 style="margin-bottom: 10px; font-size: 1.1rem;"><i class="fa-solid fa-calendar-day"></i> 1. Seleccione Fecha y Hora</h3>
            <div class="form-group">
                <label>Fecha de Turno</label>
                <input type="date" id="publicDateInput">
            </div>
            <div id="slotsContainer" class="slots-grid"></div>
        </div>

        <div id="bookingFormCard" class="public-card hidden">
            <h3 style="margin-bottom: 10px; font-size: 1.1rem;"><i class="fa-solid fa-user-pen"></i> 2. Ingrese sus Datos</h3>
            <form id="publicBookingForm">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="publicName" required>
                </div>
                <div class="form-group">
                    <label>Teléfono (WhatsApp)</label>
                    <input type="text" id="publicPhone" placeholder="+54 11 ..." required>
                </div>
                <div class="form-group">
                    <label>Edad</label>
                    <input type="number" id="publicAge">
                </div>
                <button type="submit" class="btn-nav btn-nav-primary" style="width: 100%; justify-content: center; margin-top: 20px; padding: 12px;">Confirmar Reserva</button>
            </form>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
