<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Panel de Administración | Gestión Grimoldi</title>
    
    <!-- SEO TÉCNICO: Evita que los motores de búsqueda indexen este panel privado -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Vinculación con la misma hoja de estilos ubicada en la raíz -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <!-- Encabezado del Panel de Control -->
    <header class="header-admin">
        <h1>Panel de Control de Administrador</h1>
        <p>Gestión y supervisión de turnos agendados.</p>
    </header>

    <main class="contenedor-admin">
        <!-- Sección de Filtros Operativos -->
        <section class="tarjeta-filtros">
            <label for="filtro-fecha">Filtrar por Fecha:</label>
            <input type="date" id="filtro-fecha">
            <button id="btn-refrescar" class="boton-secundario">Actualizar Lista</button>
        </section>

        <!-- Tabla donde se renderizan dinámicamente los turnos desde la base de datos -->
        <section class="tarjeta-tabla">
            <h2>Listado de Turnos</h2>
            <div class="contenedor-tabla">
                <table class="tabla-turnos">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Teléfono</th>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="lista-turnos-body">
                        <!-- El archivo ./js/admin.js inyectará las filas (<tr>) dinámicamente aquí -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Módulo JavaScript exclusivo para la lógica del administrador -->
    <script type="module" src="./js/firebase-config.js"></script>
    <script type="module" src="./js/admin.js"></script>
</body>
</html>
