<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos - Lic. Gabriela Grimoldi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Lic. Gabriela Grimoldi | Turnos Online</h1>
        <a href="admin.html" class="nav-btn">Panel Admin</a>
    </header>

    <div class="container">
        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <h2>Solicitar Nuevo Turno</h2>
            <form id="bookingForm">
                <div class="form-group">
                    <label for="patientName">Nombre y Apellido</label>
                    <input type="text" id="patientName" required placeholder="Ej. María Pérez">
                </div>
                <div class="form-group">
                    <label for="patientPhone">Teléfono / WhatsApp</label>
                    <input type="tel" id="patientPhone" required placeholder="Ej. 1123456789">
                </div>
                <div class="form-group">
                    <label for="patientAge">Edad</label>
                    <input type="number" id="patientAge" placeholder="Ej. 35">
                </div>
                <div class="form-group">
                    <label for="appointmentDate">Fecha</label>
                    <input type="date" id="appointmentDate" required>
                </div>
                <div class="form-group">
                    <label for="appointmentTime">Horario Disponible</label>
                    <select id="appointmentTime" required>
                        <option value="">Seleccione una fecha primero</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Confirmar Solicitud</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
