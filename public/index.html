<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos - Lic. Gabriela Grimoldi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="admin-header">
            <div class="brand-info">
                <h1>Lic. Gabriela Grimoldi</h1>
                <span class="badge-role"><i class="fa-solid fa-calendar-check"></i> Reserva de Turnos Online</span>
            </div>
            <nav class="header-nav">
                <a href="/admin" class="btn-nav btn-nav-outline"><i class="fa-solid fa-user-gear"></i> Acceso Admin</a>
            </nav>
        </header>
        <main class="table-card" style="padding: 30px; max-width: 600px; margin: 0 auto;">
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; color: var(--color-primary); text-align: center;">Solicitar Turno</h2>
            <form id="publicBookingForm">
                <div class="form-group">
                    <label>Nombre y Apellido</label>
                    <input type="text" id="bookingName" required placeholder="Ej. Ana Pérez">
                </div>
                <div class="form-group">
                    <label>Teléfono (WhatsApp)</label>
                    <input type="tel" id="bookingPhone" required placeholder="Ej. 1155443322">
                </div>
                <div class="form-group">
                    <label>Edad</label>
                    <input type="number" id="bookingAge" placeholder="Ej. 30">
                </div>
                <div class="form-group">
                    <label>Fecha del Turno</label>
                    <input type="date" id="bookingDate" required>
                </div>
                <div class="form-group">
                    <label>Horario Disponible</label>
                    <select id="bookingTime" required>
                        <option value="">Seleccione una fecha primero</option>
                    </select>
                </div>
                <button type="submit" class="btn-nav btn-nav-primary" style="width: 100%; justify-content: center; margin-top: 20px; padding: 12px;">Reservar Turno</button>
            </form>
            <div id="bookingResponse" class="hidden" style="margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-size: 0.9rem;"></div>
        </main>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateInput = document.getElementById('bookingDate');
            const timeSelect = document.getElementById('bookingTime');
            const form = document.getElementById('publicBookingForm');
            const responseDiv = document.getElementById('bookingResponse');
            let config = {};
            fetch('/api/config').then(res => res.json()).then(data => config = data);

            dateInput.addEventListener('change', async () => {
                const dateVal = dateInput.value;
                if (!dateVal) return;
                const selectedDate = new Date(dateVal + 'T00:00:00');
                const dayOfWeek = selectedDate.getDay();
                const allowedTimes = config.schedules ? config.schedules[dayOfWeek] || [] : [];
                timeSelect.innerHTML = '';
                if (allowedTimes.length === 0) {
                    timeSelect.innerHTML = '<option value="">Sin horarios de atención este día</option>';
                    return;
                }
                const res = await fetch('/api/appointments');
                const appointments = await res.json();
                const takenTimes = appointments
                    .filter(a => a.date === dateVal && a.status !== 'Cancelado')
                    .map(a => a.time);
                const freeTimes = allowedTimes.filter(t => !takenTimes.includes(t));
                if (freeTimes.length === 0) {
                    timeSelect.innerHTML = '<option value="">No hay turnos disponibles para esta fecha</option>';
                } else {
                    timeSelect.innerHTML = '<option value="">Seleccione un horario</option>';
                    freeTimes.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t;
                        opt.textContent = `${t} hs`;
                        timeSelect.appendChild(opt);
                    });
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const payload = {
                    name: document.getElementById('bookingName').value,
                    phone: document.getElementById('bookingPhone').value,
                    age: document.getElementById('bookingAge').value,
                    date: dateInput.value,
                    time: timeSelect.value
                };
                const res = await fetch('/api/appointments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                responseDiv.classList.remove('hidden');
                if (data.success) {
                    responseDiv.style.backgroundColor = 'var(--badge-confirmed-bg)';
                    responseDiv.style.color = 'var(--badge-confirmed-text)';
                    responseDiv.innerText = '¡Turno registrado con éxito en estado Pendiente!';
                    form.reset();
                    timeSelect.innerHTML = '<option value="">Seleccione una fecha primero</option>';
                } else {
                    responseDiv.style.backgroundColor = '#FFEBEE';
                    responseDiv.style.color = '#C62828';
                    responseDiv.innerText = data.message || 'Error al agendar el turno';
                }
            });
        });
    </script>
</body>
</html>
